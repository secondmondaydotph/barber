services:
  - type: web
    name: barber
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: BARBER_DATABASE_URL
        fromDatabase:
          name: barber-postgres
          property: connectionString

databases:
  - name: barber-postgres
    plan: free
    databaseName: barber
    user: barber_app
